# linaudit: documented waivers / excepciones documentadas
#
# One line per accepted finding:   CHECK-ID   # reason
# Una línea por hallazgo aceptado:  ID-DEL-CONTROL   # motivo
#
# A waived check is not scored (it neither adds nor subtracts) and is listed in
# the report with its reason, so it always stays visible. Write who approved it
# and when to review it. Check IDs: linaudit --plain --all, or docs/CHECKS.md.
#
# Examples / ejemplos:
# ACC-009   # Password expiry is enforced by the central directory (SSO). Approved: IT security. Review 2027-Q1
# NET-001   # Dedicated perimeter firewall in front of this segment. Ticket INF-1234
# PAT-003   # Patching is done centrally by the platform team
